  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: pytest
        name: pytest
        entry: bash -c 'uv run pytest; rc=$?; [ "$rc" -eq 5 ] && exit 0; exit "$rc"'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
