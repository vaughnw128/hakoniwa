name: Install Aikido safe-chain
description: >-
  Puts safe-chain's package-manager shims on PATH so npm, pnpm, yarn, pip, uv and poetry installs refuse
  packages published too recently. Set SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS (and optionally
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS) in the workflow or job env; hakoniwa workflows use 168 (7 days).

runs:
  using: composite
  steps:
    - name: Install Aikido safe-chain
      shell: bash
      run: | # zizmor: ignore[github-env] writes a fixed path, no external input
        if [ -z "${SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS:-}" ]; then
          echo "::error::Set SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS in the workflow or job env."
          exit 1
        fi
        if [ ! -d "$HOME/.safe-chain" ]; then
          curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh" | sh -s -- --ci
        fi
        echo "$HOME/.safe-chain/shims:$HOME/.safe-chain/bin" >> "$GITHUB_PATH"
