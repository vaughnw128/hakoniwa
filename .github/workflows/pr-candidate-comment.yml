name: PR Candidate Comment

on:
  workflow_call:
    inputs:
      pr-number:
        type: string
        required: true
      head-sha:
        type: string
        required: true
      image:
        type: string
        default: ""
      digest:
        type: string
        default: ""
      chart-url:
        type: string
        default: ""
      chart-version:
        type: string
        default: ""
      chart-name:
        description: "Chart name, defaults to the repository name."
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Candidate Comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          CHART_URL: ${{ inputs.chart-url }}
          CHART_VERSION: ${{ inputs.chart-version }}
          CHART_NAME: ${{ inputs.chart-name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const e = process.env;
            const metadata = {
              schema: "hakoniwa.pr-candidate-comment.v1",
              head_sha: e.HEAD_SHA,
              image: e.IMAGE,
              digest: e.DIGEST,
              chart_name: e.CHART_NAME || repo,
              chart_url: e.CHART_URL,
              chart_version: e.CHART_VERSION,
            };
            const lines = [
              `**PR candidate** for \`${e.HEAD_SHA.slice(0, 7)}\``,
              "",
              e.IMAGE ? `- Image: \`${e.IMAGE}\`` : null,
              e.CHART_VERSION ? `- Chart: \`${e.CHART_URL}\` version \`${e.CHART_VERSION}\`` : null,
              "",
              "Comment `/build` to rebuild this candidate, or `/upgrade` to point the Flux cluster at it.",
              "",
              `<!-- hakoniwa:candidate-comment ${JSON.stringify(metadata)} -->`,
            ].filter(line => line !== null);
            const body = lines.join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: Number(e.PR_NUMBER), per_page: 100,
            });
            const existing = comments.find(c =>
              c.user?.type === "Bot" && c.body?.includes("<!-- hakoniwa:candidate-comment"));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: Number(e.PR_NUMBER), body });
            }
