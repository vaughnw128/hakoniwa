name: Candidate

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to build."
        type: string
        required: true
      candidate-kind:
        description: "Candidate kind used in tags: pr, sha, staging, or main."
        type: string
        default: "sha"
      candidate-id:
        description: "Candidate identifier, such as PR number or staging name."
        type: string
        default: ""
      language:
        description: "Primary language: python, rust, go, or none."
        type: string
        default: "none"
      python-version:
        description: "Python version (only used when language=python). Empty lets uv resolve from .python-version or project.requires-python."
        type: string
        default: ""
      binary-name:
        description: "Rust binary name (required when language=rust)."
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile."
        type: string
        default: "./Dockerfile"
      build-context:
        description: "Docker build context."
        type: string
        default: "."
      build-args:
        description: "Extra Docker build-args."
        type: string
        default: ""
      platforms:
        description: "Docker platforms."
        type: string
        default: "linux/amd64,linux/arm64"
      image-repo:
        description: "Container image repository. Defaults to ghcr.io/<owner>/<repo>."
        type: string
        default: ""
      cache-ref:
        description: "BuildKit registry cache reference. Defaults to ghcr.io/<owner>/<repo>:buildcache."
        type: string
        default: ""
      helm-path:
        description: "Path to Helm chart directory (empty to skip preview chart)."
        type: string
        default: ""
      chart-name:
        description: "Helm chart package name. Defaults to repository name."
        type: string
        default: ""
      chart-registry:
        description: "OCI registry for preview charts. Defaults to oci://ghcr.io/<owner>/charts."
        type: string
        default: ""
      retention-days:
        description: "Retention days for uploaded chart artifacts."
        type: number
        default: 30
      helm-image-repository-key:
        description: "YQ path for the chart image repository value."
        type: string
        default: "single-container.image"
      helm-image-tag-key:
        description: "YQ path for the chart image tag value."
        type: string
        default: "single-container.imageTag"
      helm-image-digest-key:
        description: "YQ path for the chart image digest value."
        type: string
        default: "single-container.imageDigest"
      require-verify:
        description: "Run verify.yml for the candidate ref before building."
        type: boolean
        default: true
      skip-image-scan:
        description: "Skip Grype scan of the built candidate image."
        type: boolean
        default: false
      image-scan-fail-build:
        description: "Fail the build when Grype finds image vulnerabilities at or above the severity cutoff. Ignored for PR candidates, which report findings as a PR comment instead."
        type: boolean
        default: false
      image-scan-severity-cutoff:
        description: "Minimum Grype image vulnerability severity that fails the build."
        type: string
        default: "critical"
      image-scan-only-fixed:
        description: "Only fail/report image vulnerabilities that have a fix available."
        type: boolean
        default: false
      dependency-min-age-days:
        description: "Minimum package publish age required before building a candidate container."
        type: number
        default: 7
      skip-container-build:
        description: "Skip image build and publish, for example for chart-only candidates."
        type: boolean
        default: false
      chart-only:
        description: "Package the chart without stamping a newly built image."
        type: boolean
        default: false
    outputs:
      image:
        description: "Immutable candidate image reference."
        value: ${{ jobs.meta.outputs.image }}
      image_repo:
        description: "Resolved image repository."
        value: ${{ jobs.meta.outputs.image_repo }}
      image_tag:
        description: "Resolved immutable candidate image tag."
        value: ${{ jobs.meta.outputs.image_tag }}
      floating_image:
        description: "Mutable candidate image reference."
        value: ${{ jobs.meta.outputs.floating_image }}
      digest:
        description: "Built image digest."
        value: ${{ jobs.container.outputs.digest }}
      chart_version:
        description: "Preview chart version."
        value: ${{ jobs.meta.outputs.chart_version }}
      chart_url:
        description: "Preview chart OCI reference without version."
        value: ${{ jobs.meta.outputs.chart_url }}

permissions:
  contents: read
  checks: read
  packages: write
  security-events: write

jobs:
  meta:
    name: Candidate Metadata
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.compute.outputs.image }}
      image_repo: ${{ steps.compute.outputs.image_repo }}
      image_tag: ${{ steps.compute.outputs.image_tag }}
      floating_image: ${{ steps.compute.outputs.floating_image }}
      floating_tag: ${{ steps.compute.outputs.floating_tag }}
      short_sha: ${{ steps.compute.outputs.short_sha }}
      chart_name: ${{ steps.compute.outputs.chart_name }}
      chart_registry: ${{ steps.compute.outputs.chart_registry }}
      chart_version: ${{ steps.compute.outputs.chart_version }}
      chart_url: ${{ steps.compute.outputs.chart_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Checkout Hakoniwa scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: vaughnw128/hakoniwa
          ref: main
          path: .hakoniwa
          sparse-checkout: scripts
          persist-credentials: false

      - name: Work out the version this candidate would release
        id: next
        env:
          REF: ${{ inputs.ref }}
        run: bash .hakoniwa/scripts/next-version.sh "$REF"

      - id: compute
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          ref="${INPUTS_REF}"
          short_sha="${ref:0:7}"
          kind="${INPUTS_CANDIDATE_KIND}"
          id="${INPUTS_CANDIDATE_ID}"

          image_repo="${INPUTS_IMAGE_REPO}"
          [ -z "$image_repo" ] && image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [ -n "$id" ]; then
            image_tag="${kind}-${id}-${short_sha}"
            floating_tag="${kind}-${id}"
          else
            image_tag="${kind}-${short_sha}"
            floating_tag="${kind}"
          fi

          chart_name="${INPUTS_CHART_NAME}"
          [ -z "$chart_name" ] && chart_name="$repo_name"

          chart_registry="${INPUTS_CHART_REGISTRY}"
          [ -z "$chart_registry" ] && chart_registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          chart_url="${chart_registry%/}/${chart_name}"

          # Prerelease of the version this commit would release, so it sorts between the
          # last release and the next one. Without release-worthy commits, assume a patch.
          base="$NEXT_VERSION"
          if [ "$NEXT_RELEASE" != "true" ]; then
            IFS=. read -r major minor patch <<< "$NEXT_VERSION"
            base="${major}.${minor}.$((patch + 1))"
          fi
          if [ "$kind" = "pr" ] && [ -n "$id" ]; then
            chart_version="${base}-pr.${id}.${GITHUB_RUN_NUMBER}"
          else
            chart_version="${base}-${kind}.${GITHUB_RUN_NUMBER}"
          fi

          {
            echo "image=${image_repo}:${image_tag}"
            echo "image_repo=${image_repo}"
            echo "image_tag=${image_tag}"
            echo "floating_image=${image_repo}:${floating_tag}"
            echo "floating_tag=${floating_tag}"
            echo "short_sha=${short_sha}"
            echo "chart_name=${chart_name}"
            echo "chart_registry=${chart_registry}"
            echo "chart_version=${chart_version}"
            echo "chart_url=${chart_url}"
          } >> "$GITHUB_OUTPUT"
        env:
          INPUTS_REF: ${{ inputs.ref }}
          INPUTS_CANDIDATE_KIND: ${{ inputs.candidate-kind }}
          INPUTS_CANDIDATE_ID: ${{ inputs.candidate-id }}
          INPUTS_IMAGE_REPO: ${{ inputs.image-repo }}
          INPUTS_CHART_NAME: ${{ inputs.chart-name }}
          INPUTS_CHART_REGISTRY: ${{ inputs.chart-registry }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
          NEXT_RELEASE: ${{ steps.next.outputs.release }}

  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - if: ${{ inputs.language == 'rust' && inputs.binary-name == '' }}
        run: |
          echo "::error::binary-name is required when language=rust"
          exit 1

      - name: Validate Rust platforms
        if: inputs.language == 'rust'
        shell: bash
        run: |
          IFS=',' read -ra platforms <<< "${INPUTS_PLATFORMS}"
          supported=0
          for platform in "${platforms[@]}"; do
            platform="${platform//[[:space:]]/}"
            case "$platform" in
              linux/amd64|linux/arm64)
                supported=1
                ;;
              "")
                ;;
              *)
                echo "::error::Rust candidate builds support linux/amd64 and linux/arm64, got '$platform'."
                exit 1
                ;;
            esac
          done
          if [ "$supported" -ne 1 ]; then
            echo "::error::At least one supported Rust platform is required."
            exit 1
          fi
        env:
          INPUTS_PLATFORMS: ${{ inputs.platforms }}

  verify-gate:
    name: Verify Gate
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      should_verify: ${{ steps.checks.outputs.should_verify }}
      verified: ${{ steps.checks.outputs.verified }}
    steps:
      - id: checks
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          REQUIRE_VERIFY: ${{ inputs.require-verify }}
          REF: ${{ inputs.ref }}
        with:
          script: |
            const requireVerify = process.env.REQUIRE_VERIFY === "true";
            if (!requireVerify) {
              core.info("Verification disabled for this candidate.");
              core.setOutput("should_verify", "false");
              core.setOutput("verified", "true");
              return;
            }

            const { owner, repo } = context.repo;
            const ref = process.env.REF;
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref,
              per_page: 100,
            });
            const required = ["quality", "tests"];
            const successful = new Set(
              checkRuns
                .filter(run => run.status === "completed" && run.conclusion === "success")
                .flatMap(run => {
                  const name = run.name.toLowerCase();
                  return required.filter(requiredName => name.includes(requiredName));
                })
            );
            const missing = required.filter(requiredName => !successful.has(requiredName));
            core.info(`Found successful verify checks for ${ref}: ${[...successful].join(", ") || "none"}`);
            core.setOutput("should_verify", missing.length ? "true" : "false");
            core.setOutput("verified", missing.length ? "false" : "true");

  verify:
    needs: [validate, verify-gate]
    if: ${{ inputs.require-verify && needs.verify-gate.outputs.should_verify == 'true' }}
    uses: vaughnw128/hakoniwa/.github/workflows/verify.yml@main
    with:
      ref: ${{ inputs.ref }}
      language: ${{ inputs.language }}
      helm-path: ${{ inputs.helm-path }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      build-args: ${{ inputs.build-args }}
      python-version: ${{ inputs.python-version }}
      binary-name: ${{ inputs.binary-name }}

  dependency-age:
    needs: [validate, verify-gate, verify]
    if: ${{ always() && !inputs.skip-container-build && needs.validate.result == 'success' && (needs.verify-gate.outputs.verified == 'true' || needs.verify.result == 'success') }}
    uses: vaughnw128/hakoniwa/.github/workflows/dependency-age.yml@main
    with:
      ref: ${{ inputs.ref }}
      max-age-days: ${{ inputs.dependency-min-age-days }}
      check-python: ${{ inputs.language == 'python' }}
      check-rust: ${{ inputs.language == 'rust' }}

  build-rust-amd64:
    needs: [validate, verify-gate, verify, dependency-age]
    if: ${{ always() && !inputs.skip-container-build && inputs.language == 'rust' && contains(inputs.platforms, 'linux/amd64') && needs.validate.result == 'success' && needs.dependency-age.result == 'success' && (needs.verify-gate.outputs.verified == 'true' || needs.verify.result == 'success') }}
    uses: vaughnw128/hakoniwa/.github/workflows/build-rust-binary.yml@main
    with:
      binary-name: ${{ inputs.binary-name }}
      ref: ${{ inputs.ref }}
      target: x86_64-unknown-linux-gnu

  build-rust-arm64:
    needs: [validate, verify-gate, verify, dependency-age]
    if: ${{ always() && !inputs.skip-container-build && inputs.language == 'rust' && contains(inputs.platforms, 'linux/arm64') && needs.validate.result == 'success' && needs.dependency-age.result == 'success' && (needs.verify-gate.outputs.verified == 'true' || needs.verify.result == 'success') }}
    uses: vaughnw128/hakoniwa/.github/workflows/build-rust-binary.yml@main
    with:
      binary-name: ${{ inputs.binary-name }}
      ref: ${{ inputs.ref }}
      target: aarch64-unknown-linux-gnu

  container:
    name: Build Candidate Image
    needs: [meta, validate, verify-gate, verify, dependency-age, build-rust-amd64, build-rust-arm64]
    if: ${{ always() && !inputs.skip-container-build && needs.meta.result == 'success' && needs.validate.result == 'success' && needs.dependency-age.result == 'success' && (needs.verify-gate.outputs.verified == 'true' || needs.verify.result == 'success') && (inputs.language != 'rust' || ((!contains(inputs.platforms, 'linux/amd64') || needs.build-rust-amd64.result == 'success') && (!contains(inputs.platforms, 'linux/arm64') || needs.build-rust-arm64.result == 'success'))) }}
    uses: vaughnw128/hakoniwa/.github/workflows/container-build.yml@main
    with:
      ref: ${{ inputs.ref }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      platforms: ${{ inputs.platforms }}
      push: true
      cache-ref: ${{ inputs.cache-ref }}
      tags: |
        ${{ needs.meta.outputs.image }}
        ${{ needs.meta.outputs.floating_image }}
      build-args: |
        git_sha=${{ inputs.ref }}
        ${{ inputs.language == 'rust' && format('BINARY_NAME={0}', inputs.binary-name) || '' }}
        ${{ inputs.build-args }}
      artifact-amd64-name: ${{ inputs.language == 'rust' && contains(inputs.platforms, 'linux/amd64') && format('{0}-x86_64-unknown-linux-gnu', inputs.binary-name) || '' }}
      artifact-arm64-name: ${{ inputs.language == 'rust' && contains(inputs.platforms, 'linux/arm64') && format('{0}-aarch64-unknown-linux-gnu', inputs.binary-name) || '' }}
      executable-paths: |
        ${{ inputs.language == 'rust' && contains(inputs.platforms, 'linux/amd64') && format('dist/linux/amd64/{0}', inputs.binary-name) || '' }}
        ${{ inputs.language == 'rust' && contains(inputs.platforms, 'linux/arm64') && format('dist/linux/arm64/{0}', inputs.binary-name) || '' }}

  image-scan:
    name: Grype Candidate Image Scan
    needs: [meta, container]
    if: ${{ always() && needs.container.result == 'success' && !inputs.skip-image-scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Grype
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ needs.meta.outputs.image_repo }}@${{ needs.container.outputs.digest }}
          fail-build: ${{ inputs.candidate-kind != 'pr' && inputs.image-scan-fail-build }}
          severity-cutoff: ${{ inputs.image-scan-severity-cutoff }}
          only-fixed: ${{ inputs.image-scan-only-fixed }}
          output-format: sarif
          cache-db: true

      - name: Upload Grype results to GitHub Security
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image

      - name: Summarize critical and high findings
        if: always() && inputs.candidate-kind == 'pr' && steps.grype.outputs.sarif != ''
        env:
          SARIF: ${{ steps.grype.outputs.sarif }}
          IMAGE: ${{ needs.meta.outputs.image_repo }}@${{ needs.container.outputs.digest }}
        run: |
          findings="$(jq -c '
            [.runs[] | (.tool.driver.rules // []) as $rules | (.results // [])[] | .ruleId as $id
              | ([$rules[] | select(.id == $id)][0] // {}) as $rule
              | ($rule.properties["security-severity"] // "0" | tonumber) as $score
              | select($score >= 7)
              | {sev: (if $score >= 9 then "critical" else "high" end), score: $score, text: ($rule.shortDescription.text // $id)}]
            | unique_by(.text) | sort_by(-.score)' "$SARIF")"
          critical="$(jq '[.[] | select(.sev == "critical")] | length' <<< "$findings")"
          high="$(jq '[.[] | select(.sev == "high")] | length' <<< "$findings")"
          total=$((critical + high))
          {
            echo "<!-- hakoniwa:grype -->"
            if [ "$total" -eq 0 ]; then
              echo "**✅ Grype:** no critical or high vulnerabilities in the candidate image."
            else
              echo "**Grype:** ${total} findings in the candidate image (🔴 ${critical} critical, 🟠 ${high} high)"
              echo ""
              echo "<details>"
              echo "<summary>Critical and high findings</summary>"
              echo ""
              echo "| Severity | CVSS | Finding |"
              echo "|---|---|---|"
              jq -r '.[:25][] | "| \(if .sev == "critical" then "🔴 Critical" else "🟠 High" end) | \(.score) | \(.text) |"' <<< "$findings"
              echo ""
              echo "</details>"
              if [ "$total" -gt 25 ]; then
                echo ""
                echo "…and $((total - 25)) more in the Security tab."
              fi
            fi
            echo ""
            echo "Scanned \`${IMAGE}\`"
          } > grype-summary.md

      - name: Upload Grype summary
        if: always() && inputs.candidate-kind == 'pr' && hashFiles('grype-summary.md') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grype-summary
          path: grype-summary.md
          retention-days: 7
          overwrite: true

  chart:
    name: Package Candidate Chart
    needs: [meta, container, image-scan]
    if: ${{ always() && inputs.helm-path != '' && ((inputs.skip-container-build && inputs.chart-only) || (needs.container.result == 'success' && (inputs.skip-image-scan || needs.image-scan.result == 'success'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Stamp chart with candidate image
        env:
          HELM_PATH: ${{ inputs.helm-path }}
          CHART_ONLY: ${{ inputs.chart-only }}
          CHART_VERSION: ${{ needs.meta.outputs.chart_version }}
          IMAGE_REPO: ${{ needs.meta.outputs.image_repo }}
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
          REPOSITORY_KEY: ${{ inputs.helm-image-repository-key }}
          TAG_KEY: ${{ inputs.helm-image-tag-key }}
          DIGEST_KEY: ${{ inputs.helm-image-digest-key }}
        run: |
          yq -i '.version = strenv(CHART_VERSION)' "$HELM_PATH/Chart.yaml"
          if [ "$CHART_ONLY" != "true" ]; then
            yq -i '.appVersion = strenv(IMAGE_TAG)' "$HELM_PATH/Chart.yaml"
            yq -i 'eval("." + strenv(REPOSITORY_KEY)) = strenv(IMAGE_REPO)' "$HELM_PATH/values.yaml"
            yq -i 'eval("." + strenv(TAG_KEY)) = strenv(IMAGE_TAG)' "$HELM_PATH/values.yaml"
            yq -i 'eval("." + strenv(DIGEST_KEY)) = strenv(IMAGE_DIGEST)' "$HELM_PATH/values.yaml"
          fi

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Package and push chart
        run: |
          helm dependency build "${INPUTS_HELM_PATH}"
          helm package "${INPUTS_HELM_PATH}" \
            --version "${NEEDS_META_OUTPUTS_CHART_VERSION}" \
            --app-version "${NEEDS_META_OUTPUTS_IMAGE_TAG}"
          helm push "./${NEEDS_META_OUTPUTS_CHART_NAME}-${NEEDS_META_OUTPUTS_CHART_VERSION}.tgz" "${NEEDS_META_OUTPUTS_CHART_REGISTRY}"
        env:
          INPUTS_HELM_PATH: ${{ inputs.helm-path }}
          NEEDS_META_OUTPUTS_CHART_VERSION: ${{ needs.meta.outputs.chart_version }}
          NEEDS_META_OUTPUTS_IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
          NEEDS_META_OUTPUTS_CHART_NAME: ${{ needs.meta.outputs.chart_name }}
          NEEDS_META_OUTPUTS_CHART_REGISTRY: ${{ needs.meta.outputs.chart_registry }}

      - name: Upload chart artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.meta.outputs.chart_name }}-candidate-chart
          path: ./${{ needs.meta.outputs.chart_name }}-${{ needs.meta.outputs.chart_version }}.tgz
          retention-days: ${{ inputs.retention-days }}
