name: Verify PR

on:
  workflow_call:
    inputs:
      pr-title:
        description: "Pull request title to validate."
        type: string
        required: true
      pr-body:
        description: "Pull request body to validate."
        type: string
        default: ""
      require-release-intent:
        description: "Require release intent text in the PR body."
        type: boolean
        default: false
      max-title-length:
        description: "Maximum allowed PR title length."
        type: number
        default: 100

permissions:
  contents: read

jobs:
  verify-pr:
    name: PR Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata
        env:
          PR_TITLE: ${{ inputs.pr-title }}
          PR_BODY: ${{ inputs.pr-body }}
          REQUIRE_RELEASE_INTENT: ${{ inputs.require-release-intent }}
          MAX_TITLE_LENGTH: ${{ inputs.max-title-length }}
        run: |
          if [ "${#PR_TITLE}" -gt "$MAX_TITLE_LENGTH" ]; then
            echo "::error::PR title is ${#PR_TITLE} characters; max is $MAX_TITLE_LENGTH."
            exit 1
          fi

          if ! printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\(.+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, for example 'feat(api): add search'. Got: '$PR_TITLE'."
            exit 1
          fi

          if printf '%s' "$PR_TITLE" | grep -Eiq '^(wip|draft)|\[wip\]'; then
            echo "::error::PR title still looks like WIP."
            exit 1
          fi

          if [ "$REQUIRE_RELEASE_INTENT" = "true" ] && ! printf '%s' "$PR_BODY" | grep -Eiq 'release intent|release:|not released|no release'; then
            echo "::error::PR body must state release intent, for example 'Release: patch' or 'No release'."
            exit 1
          fi

          echo "PR metadata looks good."
