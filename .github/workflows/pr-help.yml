name: PR Help

on:
  workflow_call:
    inputs:
      pr-number:
        description: "Pull request number to comment on."
        type: string
        required: true
      preview-command:
        description: "Command that builds a deployable PR candidate."
        type: string
        default: "euclid build"
      release-command:
        description: "Command prefix that releases the PR."
        type: string
        default: "euclid release"
      include-release:
        description: "Whether to include release command help."
        type: boolean
        default: true
      required-approvals:
        description: "Number of approving reviews required by the release command."
        type: string
        default: "1"
      extra-notes:
        description: "Optional extra Markdown appended to the help comment."
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  help:
    name: Post PR Help
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Create or update help comment
        uses: actions/github-script@v8
        env:
          PREVIEW_COMMAND: ${{ inputs.preview-command }}
          RELEASE_COMMAND: ${{ inputs.release-command }}
          INCLUDE_RELEASE: ${{ inputs.include-release }}
          REQUIRED_APPROVALS: ${{ inputs.required-approvals }}
          EXTRA_NOTES: ${{ inputs.extra-notes }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number("${{ inputs.pr-number }}");
            const marker = "<!-- hakoniwa:pr-help -->";
            const previewCommand = process.env.PREVIEW_COMMAND || "";
            const releaseCommand = process.env.RELEASE_COMMAND || "";
            const includeRelease = process.env.INCLUDE_RELEASE === "true";
            const requiredApprovals = (process.env.REQUIRED_APPROVALS || "").trim();
            const extraNotes = (process.env.EXTRA_NOTES || "").trim();

            const lines = [
              marker,
              "### Hakoniwa PR commands",
              "",
              "Comment one of these commands on this PR:",
              "",
              `- \`${previewCommand}\` - build a verified PR candidate image and preview chart for testing.`,
            ];

            if (includeRelease) {
              lines.push(
                `- \`${releaseCommand} v1.2.3\` - merge this PR through the bot, tag it, promote the latest successful PR candidate digest for the current commit, publish the chart, and create the GitHub Release.`
              );
            }

            lines.push(
              "",
              "Release command gates:",
              "",
              "- Trusted commenter: owner, member, or collaborator.",
              "- Verify checks must already be passing for the PR head.",
              `- \`${previewCommand}\` must have succeeded for the current PR commit.`,
              `- Required approvals: ${requiredApprovals || "configured by the release workflow"}.`,
              "- The requested version must be semantic, for example `v1.2.3`."
            );

            if (extraNotes) {
              lines.push("", extraNotes);
            }

            const body = lines.join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
