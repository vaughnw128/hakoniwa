name: PR Help

on:
  workflow_call:
    inputs:
      pr-number:
        description: "Pull request number to comment on."
        type: string
        required: true
      preview-command:
        description: "Command that builds a deployable PR candidate."
        type: string
        default: "euclid build"
      release-command:
        description: "Command prefix that releases the PR."
        type: string
        default: "euclid release"
      include-release:
        description: "Whether to include release command help."
        type: boolean
        default: true
      extra-notes:
        description: "Optional extra Markdown appended to the help comment."
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  help:
    name: Post PR Help
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Create or update help comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number("${{ inputs.pr-number }}");
            const marker = "<!-- hakoniwa:pr-help -->";
            const previewCommand = `${{ inputs.preview-command }}`;
            const releaseCommand = `${{ inputs.release-command }}`;
            const includeRelease = `${{ inputs.include-release }}` === "true";
            const extraNotes = `${{ inputs.extra-notes }}`.trim();

            const lines = [
              marker,
              "### Hakoniwa PR commands",
              "",
              `- \`${previewCommand}\` builds a verified PR candidate image and preview chart for testing.`,
            ];

            if (includeRelease) {
              lines.push(
                `- \`${releaseCommand} v1.2.3\` merges this PR through the bot, verifies the protected-branch commit, tags it, promotes the tested image digest, publishes the chart, and creates the GitHub Release.`
              );
            }

            lines.push(
              "",
              "Release commands require a trusted commenter, passing verify checks, and any required approvals."
            );

            if (extraNotes) {
              lines.push("", extraNotes);
            }

            const body = lines.join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
