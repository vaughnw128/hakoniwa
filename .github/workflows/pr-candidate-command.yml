name: PR Candidate Command

on:
  workflow_call:
    inputs:
      issue-number:
        description: "Pull request number from the comment event."
        type: string
        required: true
      comment-body:
        description: "Raw comment body."
        type: string
        required: true
      comment-author-association:
        description: "GitHub author association for the comment author."
        type: string
        default: ""
      comment-author-type:
        description: "GitHub user type for the comment author, for example User or Bot."
        type: string
        default: ""
      command-prefix:
        description: "Command prefix used to request a PR candidate."
        type: string
        default: "euclid build"
      allow-forks:
        description: "Whether to allow PR candidate commands for fork PRs."
        type: boolean
        default: false
      allowed-author-associations:
        description: "Comma-separated GitHub author associations allowed to run PR candidate commands."
        type: string
        default: "OWNER,MEMBER"
      language:
        description: "Primary language: rust, python, go, or none."
        type: string
        default: "none"
      python-version:
        description: "Python version (only used when language=python)."
        type: string
        default: ""
      binary-name:
        description: "Rust binary name (required when language=rust)."
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile."
        type: string
        default: "./Dockerfile"
      build-context:
        description: "Docker build context."
        type: string
        default: "."
      build-args:
        description: "Extra Docker build-args."
        type: string
        default: ""
      platforms:
        description: "Docker platforms."
        type: string
        default: "linux/amd64,linux/arm64"
      cache-ref:
        description: "BuildKit registry cache reference."
        type: string
        default: ""
      helm-path:
        description: "Path to Helm chart directory (empty to skip chart packaging)."
        type: string
        default: ""
      chart-name:
        description: "Helm chart package name (defaults to repository name)."
        type: string
        default: ""
      skip-docs-only:
        description: "Skip PR candidate builds when only markdown files changed."
        type: boolean
        default: true
      dependency-min-age-days:
        description: "Minimum package publish age required before building a candidate container."
        type: number
        default: 7

permissions:
  contents: read
  actions: read
  checks: write
  issues: write
  packages: write
  pull-requests: read
  security-events: write

jobs:
  prepare:
    if: ${{ inputs.comment-author-type != 'Bot' }}
    uses: vaughnw128/hakoniwa/.github/workflows/pr-comment-prepare.yml@main
    with:
      issue-number: ${{ inputs.issue-number }}
      comment-body: ${{ inputs.comment-body }}
      comment-author-association: ${{ inputs.comment-author-association }}
      comment-author-type: ${{ inputs.comment-author-type }}
      command-prefix: ${{ inputs.command-prefix }}
      allow-forks: ${{ inputs.allow-forks }}
      allowed-author-associations: ${{ inputs.allowed-author-associations }}
      helm-path: ${{ inputs.helm-path }}
    secrets: inherit

  candidate:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' && !(inputs.skip-docs-only && needs.prepare.outputs.docs_only == 'true') }}
    uses: vaughnw128/hakoniwa/.github/workflows/candidate.yml@main
    with:
      ref: ${{ needs.prepare.outputs.head_sha }}
      candidate-kind: pr
      candidate-id: ${{ needs.prepare.outputs.pr_number }}
      language: ${{ inputs.language }}
      python-version: ${{ inputs.python-version }}
      binary-name: ${{ inputs.binary-name }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      build-args: ${{ inputs.build-args }}
      platforms: ${{ inputs.platforms }}
      cache-ref: ${{ inputs.cache-ref }}
      helm-path: ${{ inputs.helm-path }}
      chart-name: ${{ inputs.chart-name }}
      dependency-min-age-days: ${{ inputs.dependency-min-age-days }}
      skip-container-build: ${{ needs.prepare.outputs.chart_only == 'true' }}
      chart-only: ${{ needs.prepare.outputs.chart_only == 'true' }}
    secrets: inherit

  announce:
    name: Announce PR Candidate
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' && !(inputs.skip-docs-only && needs.prepare.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      check_id: ${{ steps.start.outputs.check_id }}
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Comment candidate start
        id: start
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const sha = "${{ needs.prepare.outputs.head_sha }}".slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let checkRunId = "";
            const chartOnly = "${{ needs.prepare.outputs.chart_only }}" === "true";
            try {
              const check = await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "Hakoniwa PR Candidate",
                head_sha: "${{ needs.prepare.outputs.head_sha }}",
                status: "in_progress",
                started_at: new Date().toISOString(),
                details_url: runUrl,
                output: {
                  title: chartOnly ? "Chart-only candidate started" : "PR candidate build started",
                  summary: chartOnly ? "Packaging a chart-only candidate without building a container image." : "Building a deployable PR candidate image and chart.",
                },
              });
              checkRunId = String(check.data.id);
            } catch (error) {
              core.warning(`Could not create PR candidate check run: ${error.message}`);
            }
            core.setOutput("check_id", checkRunId);
            const startBody = [
              (chartOnly ? "Chart-only candidate started" : "PR candidate build started") + " for `" + sha + "`.",
              "",
              "[View run](" + runUrl + ")",
            ].join("\n");
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number("${{ needs.prepare.outputs.pr_number }}"),
                body: startBody,
              });
            } catch (error) {
              core.warning(`Could not comment on PR candidate start: ${error.message}`);
            }

  notify:
    name: Notify PR Candidate
    needs: [prepare, announce, candidate]
    if: ${{ always() && needs.prepare.outputs.should_run == 'true' && !(inputs.skip-docs-only && needs.prepare.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Comment candidate result
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const ok = "${{ needs.candidate.result }}" === "success";
            const chartOnly = "${{ needs.prepare.outputs.chart_only }}" === "true";
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const checkRunId = Number("${{ needs.announce.outputs.check_id }}");
            const failedJobExcerpt = async () => {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: context.runId,
                per_page: 100,
              });
              const jobs = data.jobs
                .filter(job => ["failure", "cancelled", "timed_out"].includes(job.conclusion))
                .filter(job => job.name !== "Notify PR Candidate")
                .slice(0, 2);
              const lines = [];
              for (const job of jobs) {
                lines.push(`- ${job.name}: ${job.conclusion}`);
                try {
                  const response = await github.request("GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs", {
                    owner,
                    repo,
                    job_id: job.id,
                  });
                  const text = String(response.data || "");
                  const excerpt = text
                    .split(/\r?\n/)
                    .map(line => line.replace(/^\d{4}-\d{2}-\d{2}T[^\s]+\s+/, "").trim())
                    .filter(line =>
                      line.includes("::error") ||
                      /^error[:\s]/i.test(line) ||
                      /^fatal[:\s]/i.test(line) ||
                      /failed/i.test(line)
                    )
                    .slice(-3)
                    .join("\n")
                    .slice(0, 900);
                  if (excerpt) lines.push("```text\n" + excerpt + "\n```");
                } catch (error) {
                  core.warning(`Could not fetch logs for ${job.name}: ${error.message}`);
                }
              }
              return lines;
            };
            const failures = ok ? [] : await failedJobExcerpt();
            const details = ok
              ? (chartOnly
                ? [
                    "Chart-only candidate succeeded.",
                    "",
                    "- Chart URL: `${{ needs.candidate.outputs.chart_url }}`",
                    "- Chart version: `${{ needs.candidate.outputs.chart_version }}`",
                    "- Run: " + runUrl,
                  ]
                : [
                    "PR candidate build succeeded.",
                    "",
                    "- Image: `${{ needs.candidate.outputs.image }}`",
                    "- Docker image tag: `${{ needs.candidate.outputs.image_tag }}`",
                    "- Digest: `${{ needs.candidate.outputs.digest }}`",
                    "- Run: " + runUrl,
                  ])
              : [
                  "PR candidate build failed.",
                  "",
                  "- Prepare: `${{ needs.prepare.result }}`",
                  "- Candidate: `${{ needs.candidate.result }}`",
                  "- Run: " + runUrl,
                ];
            if (failures.length) {
              details.push("");
              details.push("Failure excerpt:");
              details.push(...failures);
            }

            if (ok && "${{ inputs.helm-path }}" !== "" && !chartOnly) {
              details.push("- Chart URL: `${{ needs.candidate.outputs.chart_url }}`");
              details.push("- Chart version: `${{ needs.candidate.outputs.chart_version }}`");
            }
            const commentLines = ok
              ? (chartOnly
                ? [
                    "Chart-only candidate ready.",
                    "",
                    "- Chart: `${{ needs.candidate.outputs.chart_version }}`",
                  ]
                : [
                    "PR candidate ready.",
                    "",
                    "- Image tag: `${{ needs.candidate.outputs.image_tag }}`",
                    "- Digest: `${{ needs.candidate.outputs.digest }}`",
                  ])
              : [
                  "PR candidate failed.",
                  "",
                  "- Candidate: `${{ needs.candidate.result }}`",
                ];
            if (failures.length) {
              commentLines.push("");
              commentLines.push("Failure excerpt:");
              commentLines.push(...failures.slice(0, 4));
            }
            if (ok && "${{ inputs.helm-path }}" !== "" && !chartOnly) {
              commentLines.push("- Chart: `${{ needs.candidate.outputs.chart_version }}`");
            }
            commentLines.push("- [View run](" + runUrl + ")");

            const metadata = ok ? {
              schema: "hakoniwa.pr-candidate.v1",
              head_sha: "${{ needs.prepare.outputs.head_sha }}",
              image: "${{ needs.candidate.outputs.image }}",
              image_repo: "${{ needs.candidate.outputs.image_repo }}",
              image_tag: "${{ needs.candidate.outputs.image_tag }}",
              digest: "${{ needs.candidate.outputs.digest }}",
              chart_url: "${{ needs.candidate.outputs.chart_url }}",
              chart_version: "${{ needs.candidate.outputs.chart_version }}",
              chart_only: chartOnly,
              run_id: String(context.runId),
            } : null;
            const summary = metadata
              ? `${details.join("\n")}\n\n<!-- hakoniwa:candidate ${JSON.stringify(metadata)} -->`
              : details.join("\n");
            await core.summary
              .addHeading(ok ? "PR Candidate Build Succeeded" : "PR Candidate Build Failed")
              .addRaw(details.join("\n"))
              .write();

            if (checkRunId) {
              try {
                await github.rest.checks.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: checkRunId,
                  status: "completed",
                  conclusion: ok ? "success" : "failure",
                  completed_at: new Date().toISOString(),
                  details_url: runUrl,
                  output: {
                    title: ok ? "PR candidate build succeeded" : "PR candidate build failed",
                    summary,
                  },
                });
              } catch (error) {
                core.warning(`Could not update PR candidate check run: ${error.message}`);
              }
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number("${{ needs.prepare.outputs.pr_number }}"),
                body: commentLines.join("\n"),
              });
            } catch (error) {
              core.warning(`Could not comment on PR candidate result: ${error.message}`);
            }

  docs-only:
    name: Skip Docs-Only Candidate
    needs: prepare
    if: ${{ inputs.skip-docs-only && needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Comment docs-only skip
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "PR candidate skipped: only markdown files changed.",
              "",
              "[View run](" + runUrl + ")",
            ].join("\n");
            await core.summary.addHeading("PR Candidate Skipped").addRaw(body).write();
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number("${{ needs.prepare.outputs.pr_number }}"),
                body,
              });
            } catch (error) {
              core.warning(`Could not comment on docs-only skip: ${error.message}`);
            }
