name: PR Comment Prepare

on:
  workflow_call:
    inputs:
      issue-number:
        description: "Issue or pull request number from the comment event"
        type: string
        required: true
      comment-body:
        description: "Raw comment body"
        type: string
        default: ""
      comment-author-association:
        description: "GitHub author association for the comment author"
        type: string
        default: ""
      comment-author-type:
        description: "GitHub user type for the comment author, for example User or Bot"
        type: string
        default: ""
      command-prefix:
        description: "Comment prefix that should trigger the downstream workflow"
        type: string
        required: true
      allow-forks:
        description: "Whether to allow PRs from forks"
        type: boolean
        default: false
    outputs:
      should_run:
        description: "Whether the comment matched and the PR is eligible"
        value: ${{ jobs.prepare.outputs.should_run }}
      head_sha:
        description: "Head SHA for the PR branch"
        value: ${{ jobs.prepare.outputs.head_sha }}
      pr_number:
        description: "Normalized PR number"
        value: ${{ jobs.prepare.outputs.pr_number }}
      command:
        description: "Parsed command: build, release, promote, or custom"
        value: ${{ jobs.prepare.outputs.command }}
      version:
        description: "Parsed release version without leading v, when present"
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: Prepare PR Context
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.prepare.outputs.should_run }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      command: ${{ steps.prepare.outputs.command }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Resolve PR context
        id: prepare
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          COMMENT_BODY: ${{ inputs.comment-body }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ inputs.comment-author-association }}
          COMMENT_AUTHOR_TYPE: ${{ inputs.comment-author-type }}
          COMMAND_PREFIX: ${{ inputs.command-prefix }}
          ALLOW_FORKS: ${{ inputs.allow-forks }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const commentBody = (process.env.COMMENT_BODY || "").trim();
            const association = process.env.COMMENT_AUTHOR_ASSOCIATION || "";
            const authorType = process.env.COMMENT_AUTHOR_TYPE || "";
            const commandPrefix = process.env.COMMAND_PREFIX || "";
            const allowForks = process.env.ALLOW_FORKS === "true";
            const trustedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);

            core.setOutput("should_run", "false");
            core.setOutput("head_sha", "");
            core.setOutput("pr_number", `${issueNumber}`);
            core.setOutput("command", "");
            core.setOutput("version", "");

            if (!commentBody.startsWith(commandPrefix)) {
              core.info(`Comment does not start with '${commandPrefix}', skipping.`);
              return;
            }

            if (authorType === "Bot") {
              core.info("Bot-authored comments are not allowed to trigger PR commands, skipping.");
              return;
            }

            const rest = commentBody.slice(commandPrefix.length).trim();
            const [command = "custom", arg = ""] = rest.split(/\s+/);
            core.setOutput("command", command);
            if (command === "release") {
              const version = arg.replace(/^v/, "");
              if (!/^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$/.test(version)) {
                core.info("Release command did not include a valid semantic version.");
                return;
              }
              core.setOutput("version", version);
            }

            if (!trustedAssociations.has(association)) {
              core.info(`Comment author association '${association}' is not allowed, skipping.`);
              return;
            }

            let pr;
            try {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: issueNumber,
              });
              pr = response.data;
            } catch (error) {
              core.info(`Issue #${issueNumber} is not a pull request or could not be loaded, skipping.`);
              return;
            }

            if (!allowForks && pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info("Fork PR detected and allow-forks is false, skipping.");
              return;
            }

            core.setOutput("should_run", "true");
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("pr_number", `${pr.number}`);
