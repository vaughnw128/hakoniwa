name: Code Scanning

on:
  workflow_call:
    inputs:
      language:
        description: "Primary language: python, rust, go, javascript, or typescript"
        type: string
        required: true
      codeql-languages:
        description: 'CodeQL languages as JSON array (e.g. ["python"]). Empty to skip CodeQL.'
        type: string
        default: ""
      semgrep-rules:
        description: "Semgrep ruleset to use (e.g. p/default, p/owasp-top-ten, p/python)"
        type: string
        default: "p/default"
      skip-semgrep:
        description: "Skip Semgrep analysis"
        type: boolean
        default: false
      skip-codeql:
        description: "Skip CodeQL analysis"
        type: boolean
        default: false
      skip-checkov:
        description: "Skip Checkov IaC scan"
        type: boolean
        default: false
      checkov-soft-fail:
        description: "Do not fail the build on Checkov findings (soft fail)"
        type: boolean
        default: false
      checkov-skip-check:
        description: "Comma-separated Checkov check IDs to skip"
        type: string
        default: ""
      skip-dependency-age:
        description: "Skip dependency publish-age checks."
        type: boolean
        default: false
      dependency-min-age-days:
        description: "Minimum allowed package age in days."
        type: number
        default: 7

    secrets:
      SEMGREP_APP_TOKEN:
        description: "Optional Semgrep AppSec Platform token."
        required: false

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-codeql && inputs.codeql-languages != '' }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(inputs.codeql-languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-semgrep }}
    container:
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run Semgrep
        run: semgrep scan --config ${INPUTS_SEMGREP_RULES} --sarif --output semgrep-results.sarif .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          INPUTS_SEMGREP_RULES: ${{ inputs.semgrep-rules }}

      - name: Upload Semgrep results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-checkov }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Find Checkov config
        id: config
        run: |
          if [ -f .checkov.yaml ]; then echo "file=.checkov.yaml" >> "$GITHUB_OUTPUT"; fi

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12.3142.0
        with:
          directory: .
          soft_fail: ${{ inputs.checkov-soft-fail }}
          skip_check: ${{ inputs.checkov-skip-check }}
          config_file: ${{ steps.config.outputs.file }}
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif

      - name: Upload Checkov results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Comment Checkov findings on the PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            let sarifPath = "checkov-results.sarif";
            if (fs.existsSync(sarifPath) && fs.statSync(sarifPath).isDirectory()) {
              const found = fs.readdirSync(sarifPath).find(f => f.endsWith(".sarif"));
              sarifPath = found ? path.join(sarifPath, found) : "";
            }
            if (!sarifPath || !fs.existsSync(sarifPath)) {
              core.info("No Checkov SARIF found; skipping the comment.");
              return;
            }

            const sarif = JSON.parse(fs.readFileSync(sarifPath, "utf8"));
            const results = (sarif.runs || []).flatMap(run => run.results || []);
            const count = level => results.filter(r => r.level === level).length;
            const label = level => ({ error: "🔴 Critical", warning: "🟠 High", note: "🟡 Medium" }[level] || "⚪ Low");

            const lines = ["<!-- hakoniwa:checkov -->"];
            if (results.length === 0) {
              lines.push("**✅ Checkov:** no findings.");
            } else {
              lines.push(
                `**Checkov:** ${results.length} findings (🔴 ${count("error")} critical, 🟠 ${count("warning")} high, 🟡 ${count("note")} medium)`,
                "",
                "<details>",
                "<summary>Top findings</summary>",
                "",
                "| Severity | Rule | Description | Location |",
                "|---|---|---|---|",
                ...results.slice(0, 25).map(r => {
                  const loc = r.locations?.[0]?.physicalLocation;
                  const where = loc ? `${loc.artifactLocation?.uri}:${loc.region?.startLine ?? ""}` : "";
                  const text = (r.message?.text || "").split("\n")[0].slice(0, 120);
                  return `| ${label(r.level)} | \`${r.ruleId}\` | ${text} | \`${where}\` |`;
                }),
                "",
                "</details>",
              );
              if (results.length > 25) lines.push("", `…and ${results.length - 25} more in the Security tab.`);
            }
            const body = lines.join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.user?.type === "Bot" && c.body?.includes("<!-- hakoniwa:checkov -->"));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  dependency-age:
    name: Dependency Age
    if: ${{ !inputs.skip-dependency-age && (inputs.language == 'python' || inputs.language == 'rust') }}
    uses: vaughnw128/hakoniwa/.github/workflows/dependency-age.yml@main
    with:
      max-age-days: ${{ inputs.dependency-min-age-days }}
      check-python: ${{ inputs.language == 'python' }}
      check-rust: ${{ inputs.language == 'rust' }}
