name: PR Preview Build

on:
  workflow_call:
    inputs:
      pr-number:
        description: "Pull request number for the preview build."
        type: string
        required: true
      head-sha:
        description: "Head SHA of the PR branch."
        type: string
        required: true
      language:
        description: "Primary language: rust, python, go, or none."
        type: string
        default: "none"
      binary-name:
        description: "Rust binary name (required when language=rust)."
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile."
        type: string
        default: "./Dockerfile"
      build-context:
        description: "Docker build context."
        type: string
        default: "."
      build-args:
        description: "Extra Docker build-args."
        type: string
        default: ""
      platforms:
        description: "Docker platforms."
        type: string
        default: "linux/amd64,linux/arm64"
      helm-path:
        description: "Path to Helm chart directory (empty to skip chart packaging)."
        type: string
        default: ""
      chart-name:
        description: "Helm chart package name (defaults to repository name)."
        type: string
        default: ""
      retention-days:
        description: "Retention days for uploaded chart artifacts."
        type: number
        default: 30
      helm-image-repository-key:
        description: "YQ path for the chart image repository value."
        type: string
        default: "single-container.image"
      helm-image-tag-key:
        description: "YQ path for the chart image tag value."
        type: string
        default: "single-container.imageTag"
      helm-image-digest-key:
        description: "YQ path for the chart image digest value."
        type: string
        default: "single-container.imageDigest"
    outputs:
      image:
        description: "Preview image reference."
        value: ${{ jobs.candidate.outputs.image }}
      chart-version:
        description: "Preview chart version."
        value: ${{ jobs.candidate.outputs.chart_version }}
      chart-url:
        description: "Preview chart OCI reference without version."
        value: ${{ jobs.candidate.outputs.chart_url }}

permissions:
  contents: read
  checks: write
  issues: write
  packages: write
  pull-requests: write
  security-events: write

jobs:
  announce:
    name: Announce Preview Start
    runs-on: ubuntu-latest
    outputs:
      check_id: ${{ steps.start.outputs.check_id }}
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Comment preview start
        id: start
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const sha = "${{ inputs.head-sha }}".slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let checkRunId = "";
            try {
              const check = await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "Hakoniwa PR Preview",
                head_sha: "${{ inputs.head-sha }}",
                status: "in_progress",
                started_at: new Date().toISOString(),
                details_url: runUrl,
                output: {
                  title: "Preview build started",
                  summary: `Building preview candidate for PR #${{ inputs.pr-number }}.`,
                },
              });
              checkRunId = String(check.data.id);
            } catch (error) {
              core.warning(`Could not create PR preview check run: ${error.message}`);
            }
            core.setOutput("check_id", checkRunId);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ inputs.pr-number }}"),
              body: [
                "Preview build started.",
                "",
                "- Commit: `" + sha + "`",
                "- Run: " + runUrl,
              ].join("\n"),
            });

  candidate:
    name: Build Candidate
    needs: announce
    uses: vaughnw128/hakoniwa/.github/workflows/candidate.yml@main
    with:
      ref: ${{ inputs.head-sha }}
      candidate-kind: pr
      candidate-id: ${{ inputs.pr-number }}
      language: ${{ inputs.language }}
      binary-name: ${{ inputs.binary-name }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      build-args: ${{ inputs.build-args }}
      platforms: ${{ inputs.platforms }}
      helm-path: ${{ inputs.helm-path }}
      chart-name: ${{ inputs.chart-name }}
      retention-days: ${{ inputs.retention-days }}
      helm-image-repository-key: ${{ inputs.helm-image-repository-key }}
      helm-image-tag-key: ${{ inputs.helm-image-tag-key }}
      helm-image-digest-key: ${{ inputs.helm-image-digest-key }}
      require-verify: true
    secrets: inherit

  notify:
    name: Notify Result
    needs: [announce, candidate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Comment result
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const sha = "${{ inputs.head-sha }}".slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = "${{ needs.candidate.result }}" === "success";
            const checkRunId = Number("${{ needs.announce.outputs.check_id }}");
            const lines = ok
              ? [
                  "Preview build is ready.",
                  "",
                  "- Image: `${{ needs.candidate.outputs.image }}`",
                  "- Docker image tag: `${{ needs.candidate.outputs.image_tag }}`",
                  "- Digest: `${{ needs.candidate.outputs.digest }}`",
                  "- Commit: `" + sha + "`",
                  "- Run: " + runUrl,
                ]
              : [
                  "Preview build failed.",
                  "",
                  "- Commit: `" + sha + "`",
                  "- Run: " + runUrl,
                ];

            if (ok && "${{ inputs.helm-path }}" !== "") {
              lines.push("- Chart URL: `${{ needs.candidate.outputs.chart_url }}`");
              lines.push("- Chart version: `${{ needs.candidate.outputs.chart_version }}`");
            }

            if (checkRunId) {
              try {
                await github.rest.checks.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: checkRunId,
                  status: "completed",
                  conclusion: ok ? "success" : "failure",
                  completed_at: new Date().toISOString(),
                  details_url: runUrl,
                  output: {
                    title: ok ? "Preview build succeeded" : "Preview build failed",
                    summary: lines.join("\n"),
                  },
                });
              } catch (error) {
                core.warning(`Could not update PR preview check run: ${error.message}`);
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ inputs.pr-number }}"),
              body: lines.join("\n"),
            });
