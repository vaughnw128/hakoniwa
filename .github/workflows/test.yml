name: Code Quality & Tests

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to verify. Defaults to the triggering SHA."
        type: string
        default: ""
      language:
        description: "Primary language: python, rust, go, or none."
        type: string
        required: true
      helm-path:
        description: "Path to Helm chart directory (empty to skip)."
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile for the optional no-push build check."
        type: string
        default: "./Dockerfile"
      docker-build-check:
        description: "Run a no-push Docker build in the quality gate."
        type: boolean
        default: false
      build-context:
        description: "Docker build context."
        type: string
        default: "."
      build-args:
        description: "Extra Docker build-args for the no-push build."
        type: string
        default: ""
      python-version:
        description: "Python version (only used when language=python). Empty lets uv resolve from .python-version or project.requires-python."
        type: string
        default: ""
      rust-toolchain:
        description: "Rust toolchain (only used when language=rust)."
        type: string
        default: "stable"
      binary-name:
        description: "Binary name for Rust builds (matches Cargo.toml package name)."
        type: string
        default: ""
      go-version:
        description: "Go version (only used when language=go)."
        type: string
        default: "1.22"
      extra-test-command:
        description: "Additional test command to run."
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  verify:
    uses: vaughnw128/hakoniwa/.github/workflows/verify.yml@main
    with:
      ref: ${{ inputs.ref }}
      language: ${{ inputs.language }}
      helm-path: ${{ inputs.helm-path }}
      dockerfile: ${{ inputs.dockerfile }}
      docker-build-check: ${{ inputs.docker-build-check }}
      build-context: ${{ inputs.build-context }}
      build-args: ${{ inputs.build-args }}
      python-version: ${{ inputs.python-version }}
      rust-toolchain: ${{ inputs.rust-toolchain }}
      binary-name: ${{ inputs.binary-name }}
      go-version: ${{ inputs.go-version }}
      extra-test-command: ${{ inputs.extra-test-command }}
