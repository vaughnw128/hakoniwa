name: Build Rust Binary

on:
  workflow_call:
    inputs:
      target:
        description: "Rust target triple (e.g. x86_64-unknown-linux-gnu)"
        type: string
        required: true
      binary-name:
        description: "Name of the binary to build (matches Cargo.toml package name)"
        type: string
        required: true
      ref:
        description: "Git ref or SHA to checkout before building"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ inputs.target }}

      - name: Install cross-compilation tools
        if: inputs.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cross linker
        if: inputs.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ inputs.target }}

      - name: Build binary
        run: cargo build --release --target ${INPUTS_TARGET}
        env:
          INPUTS_TARGET: ${{ inputs.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.binary-name }}-${{ inputs.target }}
          path: target/${{ inputs.target }}/release/${{ inputs.binary-name }}
          retention-days: 1
