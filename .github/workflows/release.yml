name: Release

on:
  workflow_call:
    inputs:
      version:
        description: "Release version, with or without leading v. Required unless called from a tag ref."
        type: string
        default: ""
      ref:
        description: "Git ref or SHA to release. Defaults to the triggering SHA."
        type: string
        default: ""
      language:
        description: "Primary language: python, rust, go, or none."
        type: string
        default: "none"
      python-version:
        description: "Python version (only used when language=python). Empty lets uv resolve from .python-version or project.requires-python."
        type: string
        default: ""
      binary-name:
        description: "Rust binary name (required when language=rust)."
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile."
        type: string
        default: "./Dockerfile"
      build-context:
        description: "Docker build context."
        type: string
        default: "."
      build-args:
        description: "Extra Docker build-args."
        type: string
        default: ""
      platforms:
        description: "Docker platforms."
        type: string
        default: "linux/amd64,linux/arm64"
      cache-ref:
        description: "BuildKit registry cache reference for candidate images."
        type: string
        default: ""
      skip-docker:
        description: "Skip candidate image build/promotion."
        type: boolean
        default: false
      helm-path:
        description: "Path to the Helm chart to package and publish (empty to skip)."
        type: string
        default: ""
      chart-name:
        description: "Helm chart package name. Defaults to repository name."
        type: string
        default: ""
      helm-registry:
        description: "OCI registry for published Helm charts."
        type: string
        default: "oci://ghcr.io/vaughnw128/charts"
    outputs:
      version:
        description: "Released version without leading v."
        value: ${{ jobs.resolve.outputs.version }}
      image:
        description: "Promoted image reference."
        value: ${{ jobs.promote.outputs.image }}

permissions:
  contents: write
  checks: read
  packages: write

jobs:
  resolve:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        shell: bash
        run: |
          version="${{ inputs.version }}"
          ref="${{ inputs.ref }}"
          [ -z "$ref" ] && ref="${GITHUB_SHA}"

          if [ -z "$version" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            ref="$GITHUB_REF_NAME"
          fi

          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release.yml requires a semver version or a v* tag ref"
            exit 1
          fi

          {
            echo "version=${version}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: [resolve, verify-gate]
    if: ${{ needs.verify-gate.outputs.should_verify == 'true' }}
    uses: vaughnw128/hakoniwa/.github/workflows/verify.yml@main
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      language: ${{ inputs.language }}
      helm-path: ${{ inputs.helm-path }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      build-args: ${{ inputs.build-args }}
      python-version: ${{ inputs.python-version }}
      binary-name: ${{ inputs.binary-name }}
    secrets: inherit

  verify-gate:
    name: Verify Gate
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      should_verify: ${{ steps.checks.outputs.should_verify }}
      verified: ${{ steps.checks.outputs.verified }}
    steps:
      - id: checks
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = "${{ needs.resolve.outputs.ref }}";
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref,
              per_page: 100,
            });
            const required = ["quality", "tests"];
            const successful = new Set(
              checkRuns
                .filter(run => run.status === "completed" && run.conclusion === "success")
                .flatMap(run => {
                  const name = run.name.toLowerCase();
                  return required.filter(requiredName => name.includes(requiredName));
                })
            );
            const missing = required.filter(requiredName => !successful.has(requiredName));
            core.info(`Found successful verify checks for ${ref}: ${[...successful].join(", ") || "none"}`);
            core.setOutput("should_verify", missing.length ? "true" : "false");
            core.setOutput("verified", missing.length ? "false" : "true");

  candidate:
    needs: [resolve, verify-gate, verify]
    if: ${{ always() && !inputs.skip-docker && needs.resolve.result == 'success' && (needs.verify-gate.outputs.verified == 'true' || needs.verify.result == 'success') }}
    uses: vaughnw128/hakoniwa/.github/workflows/candidate.yml@main
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      candidate-kind: release-candidate
      candidate-id: ${{ needs.resolve.outputs.version }}
      language: ${{ inputs.language }}
      python-version: ${{ inputs.python-version }}
      binary-name: ${{ inputs.binary-name }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      build-args: ${{ inputs.build-args }}
      platforms: ${{ inputs.platforms }}
      cache-ref: ${{ inputs.cache-ref }}
      helm-path: ""
      require-verify: false
    secrets: inherit

  promote:
    needs: [resolve, verify-gate, verify, candidate]
    if: ${{ always() && needs.resolve.result == 'success' && (needs.verify-gate.outputs.verified == 'true' || needs.verify.result == 'success') && (inputs.skip-docker || needs.candidate.result == 'success') }}
    uses: vaughnw128/hakoniwa/.github/workflows/promote.yml@main
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref: ${{ needs.resolve.outputs.ref }}
      image-digest: ${{ inputs.skip-docker && '' || needs.candidate.outputs.digest }}
      helm-path: ${{ inputs.helm-path }}
      chart-name: ${{ inputs.chart-name }}
      helm-registry: ${{ inputs.helm-registry }}
    secrets: inherit
