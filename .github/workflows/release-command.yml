name: Release Command

on:
  workflow_call:
    inputs:
      issue-number:
        description: "Pull request number from the comment event."
        type: string
        required: true
      comment-body:
        description: "Raw comment body."
        type: string
        required: true
      comment-author-association:
        description: "GitHub author association for the comment author."
        type: string
        default: ""
      comment-author-type:
        description: "GitHub user type for the comment author, for example User or Bot."
        type: string
        default: ""
      command-prefix:
        description: "Comment prefix used to request a release."
        type: string
        default: "euclid release"
      language:
        description: "Primary language: python, rust, go, or none."
        type: string
        default: "none"
      python-version:
        description: "Python version (only used when language=python). Empty lets uv resolve from .python-version or project.requires-python."
        type: string
        default: ""
      binary-name:
        description: "Rust binary name (required when language=rust)."
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile."
        type: string
        default: "./Dockerfile"
      build-context:
        description: "Docker build context."
        type: string
        default: "."
      build-args:
        description: "Extra Docker build-args."
        type: string
        default: ""
      platforms:
        description: "Docker platforms."
        type: string
        default: "linux/amd64,linux/arm64"
      cache-ref:
        description: "BuildKit registry cache reference for release candidate images."
        type: string
        default: ""
      helm-path:
        description: "Path to Helm chart directory (empty to skip chart release)."
        type: string
        default: ""
      chart-name:
        description: "Helm chart package name. Defaults to repository name."
        type: string
        default: ""
      helm-registry:
        description: "OCI registry for Helm charts."
        type: string
        default: "oci://ghcr.io/vaughnw128/charts"
      merge-method:
        description: "Pull request merge method: merge, squash, or rebase."
        type: string
        default: "squash"
      require-approval:
        description: "Deprecated. Require at least one approved review before release when required-approvals is unset."
        type: boolean
        default: true
      required-approvals:
        description: "Number of current approving reviews required before release. Empty uses require-approval for compatibility."
        type: string
        default: ""
      allow-forks:
        description: "Whether to allow release commands for fork PRs."
        type: boolean
        default: false
      skip-image-scan:
        description: "Skip Grype scan of the release candidate image."
        type: boolean
        default: false
      image-scan-fail-build:
        description: "Fail the release when Grype finds image vulnerabilities at or above the severity cutoff."
        type: boolean
        default: false
      image-scan-severity-cutoff:
        description: "Minimum Grype image vulnerability severity that fails the release."
        type: string
        default: "critical"
      image-scan-only-fixed:
        description: "Only fail/report image vulnerabilities that have a fix available."
        type: boolean
        default: false
    outputs:
      version:
        description: "Released version without leading v."
        value: ${{ jobs.parse.outputs.version }}
      merged-sha:
        description: "Commit SHA released after merge."
        value: ${{ jobs.merge.outputs.merged_sha }}
      image:
        description: "Promoted image reference."
        value: ${{ jobs.promote.outputs.image }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  checks: write
  actions: read
  security-events: write

jobs:
  parse:
    name: Parse Release Request
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.parse.outputs.should_run }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
    steps:
      - id: parse
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          COMMENT_BODY: ${{ inputs.comment-body }}
          COMMENT_AUTHOR_TYPE: ${{ inputs.comment-author-type }}
          COMMAND_PREFIX: ${{ inputs.command-prefix }}
        with:
          script: |
            const body = (process.env.COMMENT_BODY || "").trim();
            const prefix = (process.env.COMMAND_PREFIX || "").trim();
            const authorType = process.env.COMMENT_AUTHOR_TYPE || "";
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            core.setOutput("should_run", "false");
            core.setOutput("version", "");
            core.setOutput("tag", "");
            core.setOutput("pr_number", `${issueNumber}`);

            if (!body.startsWith(prefix)) {
              core.info(`Comment does not start with '${prefix}', skipping.`);
              return;
            }

            if (authorType === "Bot") {
              core.info("Bot-authored comments are not allowed to trigger release commands, skipping.");
              return;
            }

            const version = body.slice(prefix.length).trim().split(/\s+/)[0] || "";
            const normalized = version.replace(/^v/, "");
            if (!/^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$/.test(normalized)) {
              core.setFailed(`Release command must include a semantic version, e.g. '${prefix} v1.2.3'. Got '${version}'.`);
              return;
            }

            core.setOutput("should_run", "true");
            core.setOutput("version", normalized);
            core.setOutput("tag", `v${normalized}`);

  validate:
    name: Validate Release Gate
    needs: [parse, announce]
    if: ${{ needs.parse.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.validate.outputs.head_sha }}
      base_ref: ${{ steps.validate.outputs.base_ref }}
    steps:
      - id: validate
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number("${{ needs.parse.outputs.pr_number }}");
            const association = `${{ inputs.comment-author-association }}`;
            const trustedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const allowForks = `${{ inputs.allow-forks }}` === "true";
            const requiredApprovalsRaw = `${{ inputs.required-approvals }}`.trim();
            const legacyRequireApproval = `${{ inputs.require-approval }}` === "true";
            const requiredApprovals = requiredApprovalsRaw === ""
              ? (legacyRequireApproval ? 1 : 0)
              : Number(requiredApprovalsRaw);
            const tag = `${{ needs.parse.outputs.tag }}`;

            if (!Number.isInteger(requiredApprovals) || requiredApprovals < 0) {
              core.setFailed(`required-approvals must be a non-negative integer. Got '${requiredApprovalsRaw}'.`);
              return;
            }

            if (!trustedAssociations.has(association)) {
              core.setFailed(`Comment author association '${association}' is not allowed to release.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== "open") {
              core.setFailed(`PR #${pull_number} is not open.`);
              return;
            }
            if (!allowForks && pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed("Fork PR releases are disabled.");
              return;
            }

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.setFailed(`Tag ${tag} already exists.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (requiredApprovals > 0) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number, per_page: 100 });
              const latestByUser = new Map();
              for (const review of reviews) latestByUser.set(review.user.login, review.state);
              const approvalCount = [...latestByUser.values()].filter(state => state === "APPROVED").length;
              if (approvalCount < requiredApprovals) {
                core.setFailed(`Release requires ${requiredApprovals} current approving review(s); found ${approvalCount}.`);
                return;
              }
            }

            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: pr.head.sha,
              per_page: 100,
            });
            const requiredFailures = checkRuns.filter(run =>
              run.name.toLowerCase().includes("verify") &&
              run.conclusion !== "success"
            );
            const verifyRuns = checkRuns.filter(run => run.name.toLowerCase().includes("verify"));
            if (!verifyRuns.length) {
              core.setFailed("No verify check runs were found for the PR head SHA.");
              return;
            }
            if (requiredFailures.length) {
              core.setFailed(`Verify checks are not green: ${requiredFailures.map(r => `${r.name}=${r.conclusion}`).join(", ")}`);
              return;
            }

            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("base_ref", pr.base.ref);

      - name: Comment validation start
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ needs.parse.outputs.pr_number }}"),
              body: "Release `${{ needs.parse.outputs.tag }}` requested. Gate checks passed; resolving the latest tested PR candidate before merge.",
            });

  announce:
    name: Announce Release Start
    needs: parse
    if: ${{ needs.parse.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      check_id: ${{ steps.start.outputs.check_id }}
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Comment release start
        id: start
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number("${{ needs.parse.outputs.pr_number }}");
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            let checkRunId = "";
            try {
              const check = await github.rest.checks.create({
                owner,
                repo,
                name: "Hakoniwa Release Command",
                head_sha: pr.head.sha,
                status: "in_progress",
                started_at: new Date().toISOString(),
                details_url: runUrl,
                output: {
                  title: "Release command received",
                  summary: "Validating release gates before resolving the tested PR candidate.",
                },
              });
              checkRunId = String(check.data.id);
            } catch (error) {
              core.warning(`Could not create release command check run: ${error.message}`);
            }
            core.setOutput("check_id", checkRunId);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: [
                "Release `${{ needs.parse.outputs.tag }}` command received.",
                "",
                "- Status: validating release gates.",
                "- Run: " + runUrl,
              ].join("\n"),
            });

  merge:
    name: Merge Pull Request
    needs: [parse, validate, resolve-candidate]
    if: ${{ always() && needs.parse.outputs.should_run == 'true' && needs.validate.result == 'success' && needs.resolve-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      merged_sha: ${{ steps.merge.outputs.merged_sha }}
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - id: merge
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number("${{ needs.parse.outputs.pr_number }}");
            const method = `${{ inputs.merge-method }}`;

            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number,
              merge_method: method,
              commit_title: `Release ${{ needs.parse.outputs.tag }} (#${pull_number})`,
            });

            core.setOutput("merged_sha", merge.data.sha);

  verify:
    needs: [parse, validate, verify-gate]
    if: ${{ needs.parse.outputs.should_run == 'true' && needs.verify-gate.outputs.should_verify == 'true' }}
    uses: vaughnw128/hakoniwa/.github/workflows/verify.yml@main
    with:
      ref: ${{ needs.validate.outputs.head_sha }}
      language: ${{ inputs.language }}
      helm-path: ${{ inputs.helm-path }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      build-args: ${{ inputs.build-args }}
      python-version: ${{ inputs.python-version }}
      binary-name: ${{ inputs.binary-name }}
    secrets: inherit

  verify-gate:
    name: Verify Gate
    needs: [parse, validate]
    if: ${{ needs.parse.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      should_verify: ${{ steps.checks.outputs.should_verify }}
      verified: ${{ steps.checks.outputs.verified }}
    steps:
      - id: checks
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = "${{ needs.validate.outputs.head_sha }}";
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref,
              per_page: 100,
            });
            const required = ["quality", "tests"];
            const successful = new Set(
              checkRuns
                .filter(run => run.status === "completed" && run.conclusion === "success")
                .flatMap(run => {
                  const name = run.name.toLowerCase();
                  return required.filter(requiredName => name.includes(requiredName));
                })
            );
            const missing = required.filter(requiredName => !successful.has(requiredName));
            core.info(`Found successful verify checks for ${ref}: ${[...successful].join(", ") || "none"}`);
            core.setOutput("should_verify", missing.length ? "true" : "false");
            core.setOutput("verified", missing.length ? "false" : "true");

  resolve-candidate:
    name: Resolve Tested PR Candidate
    needs: [parse, validate, verify-gate, verify]
    if: ${{ always() && needs.parse.outputs.should_run == 'true' && needs.validate.result == 'success' && (needs.verify-gate.outputs.verified == 'true' || needs.verify.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      image: ${{ steps.resolve.outputs.image }}
      image_repo: ${{ steps.resolve.outputs.image_repo }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      chart_url: ${{ steps.resolve.outputs.chart_url }}
      chart_version: ${{ steps.resolve.outputs.chart_version }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
    steps:
      - id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = "${{ needs.validate.outputs.head_sha }}";
            const requiresChart = "${{ inputs.helm-path }}" !== "";
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: headSha,
              check_name: "Hakoniwa PR Candidate",
              per_page: 100,
            });
            const candidates = checkRuns
              .filter(run => run.name === "Hakoniwa PR Candidate" && run.status === "completed" && run.conclusion === "success")
              .sort((a, b) => new Date(b.completed_at || b.started_at || 0) - new Date(a.completed_at || a.started_at || 0));

            for (const run of candidates) {
              const { data } = await github.rest.checks.get({ owner, repo, check_run_id: run.id });
              const summary = data.output?.summary || "";
              const match = summary.match(/<!--\s*hakoniwa:candidate\s+({[\s\S]*?})\s*-->/);
              if (!match) continue;

              let metadata;
              try {
                metadata = JSON.parse(match[1]);
              } catch (error) {
                core.warning(`Could not parse candidate metadata from check ${run.id}: ${error.message}`);
                continue;
              }

              if (metadata.schema !== "hakoniwa.pr-candidate.v1") continue;
              if (metadata.head_sha !== headSha) continue;
              if (!metadata.digest || !metadata.digest.startsWith("sha256:")) continue;
              if (requiresChart && (!metadata.chart_url || !metadata.chart_version)) {
                core.warning(`Candidate check ${run.id} did not include published chart metadata.`);
                continue;
              }

              core.setOutput("digest", metadata.digest);
              core.setOutput("image", metadata.image || "");
              core.setOutput("image_repo", metadata.image_repo || "");
              core.setOutput("image_tag", metadata.image_tag || "");
              core.setOutput("chart_url", metadata.chart_url || "");
              core.setOutput("chart_version", metadata.chart_version || "");
              core.setOutput("source_run_id", metadata.run_id || "");
              core.info(`Resolved PR candidate digest ${metadata.digest} from check ${run.id}.`);
              return;
            }

            const chartRequirement = requiresChart ? " and published chart metadata" : "";
            core.setFailed(`No successful Hakoniwa PR Candidate check with reusable image digest${chartRequirement} was found for ${headSha}. Run the PR candidate build command on the latest PR commit, then retry release.`);

  tag:
    name: Create Release Tag
    needs: [parse, merge, resolve-candidate]
    if: ${{ always() && needs.parse.outputs.should_run == 'true' && needs.merge.result == 'success' && needs.resolve-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Create tag on released commit
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/${{ needs.parse.outputs.tag }}",
              sha: "${{ needs.merge.outputs.merged_sha }}",
            });

  promote:
    needs: [parse, merge, resolve-candidate, tag]
    if: ${{ always() && needs.parse.outputs.should_run == 'true' && needs.merge.result == 'success' && needs.resolve-candidate.result == 'success' && needs.tag.result == 'success' }}
    uses: vaughnw128/hakoniwa/.github/workflows/promote.yml@main
    with:
      version: ${{ needs.parse.outputs.version }}
      ref: ${{ needs.merge.outputs.merged_sha }}
      image-digest: ${{ needs.resolve-candidate.outputs.digest }}
      helm-path: ${{ inputs.helm-path }}
      chart-name: ${{ inputs.chart-name }}
      helm-registry: ${{ inputs.helm-registry }}
    secrets: inherit

  notify:
    name: Notify Release
    needs: [parse, announce, validate, resolve-candidate, merge, tag, promote]
    if: ${{ always() && needs.parse.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Comment release result
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const ok = "${{ needs.promote.result }}" === "success";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const checkRunId = Number("${{ needs.announce.outputs.check_id }}");
            const body = ok
              ? (() => {
                const lines = [
                  "Released `${{ needs.parse.outputs.tag }}`.",
                  "",
                  "- Commit: `${{ needs.merge.outputs.merged_sha }}`",
                  "- Image: `${{ needs.promote.outputs.image }}`",
                  "- Candidate digest: `${{ needs.resolve-candidate.outputs.digest }}`",
                  "- Candidate image tag: `${{ needs.resolve-candidate.outputs.image_tag }}`",
                ];
                const chartUrl = "${{ needs.resolve-candidate.outputs.chart_url }}";
                const chartVersion = "${{ needs.resolve-candidate.outputs.chart_version }}";
                if (chartUrl) lines.push("- Chart URL: `" + chartUrl + "`");
                if (chartVersion) lines.push("- Chart version: `" + chartVersion + "`");
                return lines.join("\n");
              })()
              : [
                  "Release `${{ needs.parse.outputs.tag }}` did not complete.",
                  "",
                  "- Merge: `${{ needs.merge.result }}`",
                  "- Validate: `${{ needs.validate.result }}`",
                  "- Candidate: `${{ needs.resolve-candidate.result }}`",
                  "- Tag: `${{ needs.tag.result }}`",
                  "- Promote: `${{ needs.promote.result }}`",
                  "- Run: " + runUrl,
                ].join("\n");
            if (checkRunId) {
              try {
                await github.rest.checks.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: checkRunId,
                  status: "completed",
                  conclusion: ok ? "success" : "failure",
                  completed_at: new Date().toISOString(),
                  details_url: runUrl,
                  output: {
                    title: ok ? "Release command succeeded" : "Release command failed",
                    summary: body,
                  },
                });
              } catch (error) {
                core.warning(`Could not update release command check run: ${error.message}`);
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number("${{ needs.parse.outputs.pr_number }}"),
              body,
            });
