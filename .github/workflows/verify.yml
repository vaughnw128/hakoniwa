name: Verify

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to verify. Defaults to the triggering SHA."
        type: string
        default: ""
      language:
        description: "Primary language: python, rust, go, or none."
        type: string
        required: true
      helm-path:
        description: "Path to Helm chart directory (empty to skip)."
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile for the optional no-push build check."
        type: string
        default: "./Dockerfile"
      docker-build-check:
        description: "Run a no-push Docker build in the quality gate."
        type: boolean
        default: false
      build-context:
        description: "Docker build context."
        type: string
        default: "."
      build-args:
        description: "Extra Docker build-args for the no-push build."
        type: string
        default: ""
      python-version:
        description: "Python version (only used when language=python). Empty lets uv resolve from .python-version or project.requires-python."
        type: string
        default: ""
      rust-toolchain:
        description: "Rust toolchain (only used when language=rust)."
        type: string
        default: "stable"
      binary-name:
        description: "Binary name for Rust builds (matches Cargo.toml package name)."
        type: string
        default: ""
      go-version:
        description: "Go version (only used when language=go)."
        type: string
        default: "1.22"
      extra-test-command:
        description: "Additional test command to run."
        type: string
        default: ""

permissions:
  contents: read
  packages: read

env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "168"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install safe-chain
        if: inputs.language == 'python'
        uses: vaughnw128/hakoniwa/.github/actions/safe-chain@main

      - name: Install uv
        if: inputs.language == 'python' && inputs.python-version == ''
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
          cache-suffix: quality
          cache-python: true
          ignore-nothing-to-cache: true

      - name: Install uv with explicit Python
        if: inputs.language == 'python' && inputs.python-version != ''
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
          cache-suffix: quality
          cache-python: true
          ignore-nothing-to-cache: true

      - name: Ruff format check
        if: inputs.language == 'python'
        run: uvx ruff format --check

      - name: Ruff lint
        if: inputs.language == 'python'
        run: uvx ruff check

      - name: Setup Rust toolchain
        if: inputs.language == 'rust'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        if: inputs.language == 'rust'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: verify-quality-${{ inputs.rust-toolchain }}

      - name: Rust format check
        if: inputs.language == 'rust'
        run: cargo fmt --check

      - name: Clippy
        if: inputs.language == 'rust'
        run: cargo clippy -- -D warnings

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Go vet
        if: inputs.language == 'go'
        run: go vet ./...

      - name: golangci-lint
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2

      - name: Set up Helm
        if: inputs.helm-path != ''
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Login to GitHub Container Registry for Helm dependencies
        if: inputs.helm-path != ''
        run: echo "${{ github.token }}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Helm dependency build
        if: inputs.helm-path != ''
        run: helm dependency build "${INPUTS_HELM_PATH}"
        env:
          INPUTS_HELM_PATH: ${{ inputs.helm-path }}

      - name: Helm lint
        if: inputs.helm-path != ''
        run: helm lint "${INPUTS_HELM_PATH}"
        env:
          INPUTS_HELM_PATH: ${{ inputs.helm-path }}

      - name: Helm template
        if: inputs.helm-path != ''
        run: helm template "${INPUTS_HELM_PATH}"
        env:
          INPUTS_HELM_PATH: ${{ inputs.helm-path }}

      - name: Set up Docker Buildx
        if: inputs.docker-build-check && inputs.dockerfile != ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Cache Rust dependencies for Docker build check
        if: inputs.docker-build-check && inputs.language == 'rust' && inputs.dockerfile != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build Rust binary for Docker build check
        if: inputs.docker-build-check && inputs.language == 'rust' && inputs.binary-name != '' && inputs.dockerfile != ''
        run: |
          cargo build --release
          mkdir -p dist/linux/amd64
          cp target/release/${INPUTS_BINARY_NAME} dist/linux/amd64/${INPUTS_BINARY_NAME}
        env:
          INPUTS_BINARY_NAME: ${{ inputs.binary-name }}

      - name: Build Docker image without pushing
        if: inputs.docker-build-check && inputs.dockerfile != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ github.repository }}-verify
          cache-to: type=gha,mode=max,scope=${{ github.repository }}-verify,ignore-error=true
          build-args: |
            ${{ inputs.language == 'rust' && inputs.binary-name != '' && format('BINARY_NAME={0}', inputs.binary-name) || '' }}
            ${{ inputs.build-args }}

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install safe-chain
        if: inputs.language == 'python'
        uses: vaughnw128/hakoniwa/.github/actions/safe-chain@main

      - name: Install uv
        if: inputs.language == 'python' && inputs.python-version == ''
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
          cache-suffix: tests
          cache-python: true
          ignore-nothing-to-cache: true

      - name: Install uv with explicit Python
        if: inputs.language == 'python' && inputs.python-version != ''
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            **/*.py.lock
          cache-suffix: tests
          cache-python: true
          ignore-nothing-to-cache: true

      - name: Sync Python dependencies
        if: inputs.language == 'python'
        run: uv sync --all-groups

      - name: Pytest
        if: inputs.language == 'python'
        run: |
          if [ -d "tests" ] && [ -n "$(find tests -name 'test_*.py' -o -name '*_test.py' 2>/dev/null)" ]; then
            uv run pytest
          else
            echo "No tests found, skipping"
          fi

      - name: Setup Rust toolchain
        if: inputs.language == 'rust'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Cache Rust dependencies
        if: inputs.language == 'rust'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: verify-tests-${{ inputs.rust-toolchain }}

      - name: Cargo test
        if: inputs.language == 'rust'
        run: cargo test

      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Go test
        if: inputs.language == 'go'
        run: go test ./...

      - name: Run extra test command
        if: inputs.extra-test-command != ''
        run: ${INPUTS_EXTRA_TEST_COMMAND}
        env:
          INPUTS_EXTRA_TEST_COMMAND: ${{ inputs.extra-test-command }}
