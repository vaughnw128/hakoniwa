name: Pre-commit

on:
  workflow_call:
    inputs:
      language:
        description: "Primary language: python, rust, go, or none."
        type: string
        default: "none"
      python-version:
        type: string
        default: ""

permissions:
  contents: read

env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "168"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install safe-chain
        if: ${{ inputs.language == 'python' }}
        uses: vaughnw128/hakoniwa/.github/actions/safe-chain@main

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: ${{ inputs.language == 'python' }}
        with:
          python-version: ${{ inputs.python-version }}

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        if: ${{ inputs.language == 'rust' }}
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: ${{ inputs.language == 'go' }}
        with:
          go-version-file: go.mod

      - name: Run pre-commit
        run: |
          pipx install pre-commit
          pre-commit run --all-files --show-diff-on-failure
