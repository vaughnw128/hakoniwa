name: Promote

on:
  workflow_call:
    inputs:
      version:
        description: "Release version, with or without leading v."
        type: string
        required: true
      ref:
        description: "Git ref or SHA to package release metadata from."
        type: string
        required: true
      image-repo:
        description: "Container image repository. Defaults to ghcr.io/<owner>/<repo>."
        type: string
        default: ""
      image-digest:
        description: "Candidate image digest to promote."
        type: string
        default: ""
      helm-path:
        description: "Path to Helm chart directory (empty to skip chart release)."
        type: string
        default: ""
      chart-name:
        description: "Helm chart package name. Defaults to repository name."
        type: string
        default: ""
      helm-image-repository-key:
        description: "YQ path for the chart image repository value."
        type: string
        default: "single-container.image"
      helm-image-tag-key:
        description: "YQ path for the chart image tag value."
        type: string
        default: "single-container.imageTag"
      helm-image-digest-key:
        description: "YQ path for the chart image digest value."
        type: string
        default: "single-container.imageDigest"
      helm-registry:
        description: "OCI registry for Helm charts."
        type: string
        default: "oci://ghcr.io/vaughnw128/charts"
      create-github-release:
        description: "Create a GitHub Release for the tag."
        type: boolean
        default: true
    outputs:
      version:
        description: "Normalized version without leading v."
        value: ${{ jobs.meta.outputs.version }}
      tag:
        description: "Git tag name."
        value: ${{ jobs.meta.outputs.tag }}
      image:
        description: "Promoted image reference."
        value: ${{ jobs.meta.outputs.image }}

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Promotion Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      image_repo: ${{ steps.compute.outputs.image_repo }}
      image: ${{ steps.compute.outputs.image }}
      chart_name: ${{ steps.compute.outputs.chart_name }}
    steps:
      - id: compute
        shell: bash
        run: |
          raw="${INPUTS_VERSION}"
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be semantic version-like, got '$raw'"
            exit 1
          fi

          image_repo="${INPUTS_IMAGE_REPO}"
          [ -z "$image_repo" ] && image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"

          chart_name="${INPUTS_CHART_NAME}"
          [ -z "$chart_name" ] && chart_name="${GITHUB_REPOSITORY#*/}"

          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "image_repo=${image_repo}"
            echo "image=${image_repo}:${version}"
            echo "chart_name=${chart_name}"
          } >> "$GITHUB_OUTPUT"
        env:
          INPUTS_VERSION: ${{ inputs.version }}
          INPUTS_IMAGE_REPO: ${{ inputs.image-repo }}
          INPUTS_CHART_NAME: ${{ inputs.chart-name }}

  image:
    name: Promote Image Digest
    needs: meta
    if: ${{ inputs.image-digest != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate digest to release tags
        run: |
          docker buildx imagetools create \
            -t "${NEEDS_META_OUTPUTS_IMAGE_REPO}:${NEEDS_META_OUTPUTS_VERSION}" \
            -t "${NEEDS_META_OUTPUTS_IMAGE_REPO}:latest" \
            "${NEEDS_META_OUTPUTS_IMAGE_REPO}@${INPUTS_IMAGE_DIGEST}"
        env:
          NEEDS_META_OUTPUTS_IMAGE_REPO: ${{ needs.meta.outputs.image_repo }}
          NEEDS_META_OUTPUTS_VERSION: ${{ needs.meta.outputs.version }}
          INPUTS_IMAGE_DIGEST: ${{ inputs.image-digest }}

  chart:
    name: Publish Release Chart
    needs: [meta, image]
    if: ${{ always() && inputs.helm-path != '' && (inputs.image-digest == '' || needs.image.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Stamp release chart
        env:
          HELM_PATH: ${{ inputs.helm-path }}
          VERSION: ${{ needs.meta.outputs.version }}
          IMAGE_REPO: ${{ needs.meta.outputs.image_repo }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          REPOSITORY_KEY: ${{ inputs.helm-image-repository-key }}
          TAG_KEY: ${{ inputs.helm-image-tag-key }}
          DIGEST_KEY: ${{ inputs.helm-image-digest-key }}
        run: |
          yq -i '.version = strenv(VERSION)' "$HELM_PATH/Chart.yaml"
          if [ -n "$IMAGE_DIGEST" ]; then
            yq -i '.appVersion = strenv(VERSION)' "$HELM_PATH/Chart.yaml"
            yq -i 'eval("." + strenv(REPOSITORY_KEY)) = strenv(IMAGE_REPO)' "$HELM_PATH/values.yaml"
            yq -i 'eval("." + strenv(TAG_KEY)) = strenv(VERSION)' "$HELM_PATH/values.yaml"
            yq -i 'eval("." + strenv(DIGEST_KEY)) = strenv(IMAGE_DIGEST)' "$HELM_PATH/values.yaml"
          fi

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Package and push chart
        run: |
          helm dependency build "${INPUTS_HELM_PATH}"
          helm package "${INPUTS_HELM_PATH}" \
            --version "${NEEDS_META_OUTPUTS_VERSION}" \
            --app-version "${NEEDS_META_OUTPUTS_VERSION}"
          helm push "./${NEEDS_META_OUTPUTS_CHART_NAME}-${NEEDS_META_OUTPUTS_VERSION}.tgz" "${INPUTS_HELM_REGISTRY}"
        env:
          INPUTS_HELM_PATH: ${{ inputs.helm-path }}
          NEEDS_META_OUTPUTS_VERSION: ${{ needs.meta.outputs.version }}
          NEEDS_META_OUTPUTS_CHART_NAME: ${{ needs.meta.outputs.chart_name }}
          INPUTS_HELM_REGISTRY: ${{ inputs.helm-registry }}

  github-release:
    name: Create GitHub Release
    needs: [meta, image, chart]
    if: ${{ always() && inputs.create-github-release && (inputs.image-digest == '' || needs.image.result == 'success') && (inputs.helm-path == '' || needs.chart.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_META_OUTPUTS_TAG: ${{ needs.meta.outputs.tag }}
          INPUTS_REF: ${{ inputs.ref }}
        run: |
          gh release create "${NEEDS_META_OUTPUTS_TAG}" --repo "$GITHUB_REPOSITORY" \
            --target "${INPUTS_REF}" \
            --title "${NEEDS_META_OUTPUTS_TAG}" \
            --generate-notes
