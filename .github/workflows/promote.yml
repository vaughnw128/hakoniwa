name: Promote

on:
  workflow_call:
    inputs:
      version:
        description: "Release version, with or without leading v."
        type: string
        required: true
      ref:
        description: "Git ref or SHA to package release metadata from."
        type: string
        required: true
      image-repo:
        description: "Container image repository. Defaults to ghcr.io/<owner>/<repo>."
        type: string
        default: ""
      image-digest:
        description: "Candidate image digest to promote."
        type: string
        default: ""
      helm-path:
        description: "Path to Helm chart directory (empty to skip chart release)."
        type: string
        default: ""
      chart-name:
        description: "Helm chart package name. Defaults to repository name."
        type: string
        default: ""
      helm-registry:
        description: "OCI registry for Helm charts."
        type: string
        default: "oci://ghcr.io/vaughnw128/charts"
      create-github-release:
        description: "Create a GitHub Release for the tag."
        type: boolean
        default: true
    outputs:
      version:
        description: "Normalized version without leading v."
        value: ${{ jobs.meta.outputs.version }}
      tag:
        description: "Git tag name."
        value: ${{ jobs.meta.outputs.tag }}
      image:
        description: "Promoted image reference."
        value: ${{ jobs.meta.outputs.image }}

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Promotion Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      image_repo: ${{ steps.compute.outputs.image_repo }}
      image: ${{ steps.compute.outputs.image }}
      chart_name: ${{ steps.compute.outputs.chart_name }}
    steps:
      - id: compute
        shell: bash
        run: |
          raw="${{ inputs.version }}"
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be semantic version-like, got '$raw'"
            exit 1
          fi

          image_repo="${{ inputs.image-repo }}"
          [ -z "$image_repo" ] && image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"

          chart_name="${{ inputs.chart-name }}"
          [ -z "$chart_name" ] && chart_name="${GITHUB_REPOSITORY#*/}"

          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "image_repo=${image_repo}"
            echo "image=${image_repo}:${version}"
            echo "chart_name=${chart_name}"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Promote Image Digest
    needs: meta
    if: ${{ inputs.image-digest != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate digest to release tags
        run: |
          docker buildx imagetools create \
            -t "${{ needs.meta.outputs.image_repo }}:${{ needs.meta.outputs.version }}" \
            -t "${{ needs.meta.outputs.image_repo }}:latest" \
            "${{ needs.meta.outputs.image_repo }}@${{ inputs.image-digest }}"

  chart:
    name: Publish Release Chart
    needs: [meta, image]
    if: ${{ always() && inputs.helm-path != '' && (inputs.image-digest == '' || needs.image.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: azure/setup-helm@v5

      - name: Stamp release chart
        uses: mikefarah/yq@v4.45.4
        with:
          cmd: |
            yq -i '.version = "${{ needs.meta.outputs.version }}"' ${{ inputs.helm-path }}/Chart.yaml
            yq -i '.appVersion = "${{ needs.meta.outputs.version }}"' ${{ inputs.helm-path }}/Chart.yaml
            yq -i '.single-container.image = "${{ needs.meta.outputs.image_repo }}"' ${{ inputs.helm-path }}/values.yaml
            yq -i '.single-container.imageTag = "${{ needs.meta.outputs.version }}"' ${{ inputs.helm-path }}/values.yaml
            if [ -n "${{ inputs.image-digest }}" ]; then
              yq -i '.single-container.imageDigest = "${{ inputs.image-digest }}"' ${{ inputs.helm-path }}/values.yaml
            fi

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        run: |
          helm dependency build "${{ inputs.helm-path }}"
          helm package "${{ inputs.helm-path }}" \
            --version "${{ needs.meta.outputs.version }}" \
            --app-version "${{ needs.meta.outputs.version }}"
          helm push "./${{ needs.meta.outputs.chart_name }}-${{ needs.meta.outputs.version }}.tgz" "${{ inputs.helm-registry }}"

  github-release:
    name: Create GitHub Release
    needs: [meta, image, chart]
    if: ${{ always() && inputs.create-github-release && (inputs.image-digest == '' || needs.image.result == 'success') && (inputs.helm-path == '' || needs.chart.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Get app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${{ needs.meta.outputs.tag }}" \
            --target "${{ inputs.ref }}" \
            --title "${{ needs.meta.outputs.tag }}" \
            --generate-notes
