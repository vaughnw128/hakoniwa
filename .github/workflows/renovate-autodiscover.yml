name: Renovate

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      repositories:
        description: "Space-separated owner/name list to run on instead of autodiscovering."
        type: string
        default: ""
      log-level:
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Get app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] autodiscover needs every installed repo
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          RENOVATE_CONFIG_FILE: renovate-global.json
          RENOVATE_REPOSITORIES: ${{ inputs.repositories }}
          RENOVATE_AUTODISCOVER: ${{ inputs.repositories == '' && 'true' || 'false' }}
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: "latest"
